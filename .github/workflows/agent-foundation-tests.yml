name: Agent foundation unit tests

on:
  push:
    branches:
      - feature/sales-agents-foundation-20261123
  pull_request:
    paths:
      - "src/lib/agent*.js"
      - "tests/agent*.test.js"
      - ".github/workflows/agent-foundation-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    name: Pure agent rule tests (no live Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/agentPermissions.test.js tests/agentCommission.test.js tests/agentMarginDecision.test.js tests/agentExceptionApproval.test.js
