<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>התאמת תמונות למוצרים — QuickStock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f4f5f7; color: #1a1a1a; min-height: 100vh; }

  .login-screen { max-width: 380px; margin: 80px auto; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .login-screen h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  .login-screen input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 12px; font-size: 14px; direction: ltr; }
  .login-screen button { width: 100%; padding: 12px; background: #2d6a4f; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .login-screen button:hover { background: #1b4332; }
  .login-screen .error { color: #dc2626; font-size: 13px; margin-bottom: 10px; text-align: center; }

  .app { display: none; }
  .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .stats { font-size: 13px; color: #666; }

  .main { display: flex; gap: 16px; padding: 16px 24px; height: calc(100vh - 120px); }

  .drop-zone-panel { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  .drop-zone { border: 2px dashed #aaa; border-radius: 14px; padding: 24px; text-align: center; color: #888; font-size: 14px; cursor: pointer; transition: border-color 0.2s, background 0.2s; min-height: 120px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
  .drop-zone.dragover { border-color: #2d6a4f; background: #e8f5e9; color: #2d6a4f; }
  .drop-zone input { display: none; }
  .image-strip { flex: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
  .image-strip-item { width: 72px; height: 72px; border-radius: 10px; overflow: hidden; border: 2px solid #e0e0e0; cursor: grab; position: relative; flex-shrink: 0; }
  .image-strip-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .image-strip-item.dragging { opacity: 0.4; }
  .image-strip-item .remove-img { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 14px; line-height: 1; cursor: pointer; display: none; }
  .image-strip-item:hover .remove-img { display: block; }

  .products-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .search-bar { position: relative; }
  .search-bar input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; background: #fff; }
  .search-bar .clear { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #999; font-size: 18px; cursor: pointer; }

  .product-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .product-row { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid transparent; border-radius: 12px; padding: 10px 14px; transition: border-color 0.15s, background 0.15s; }
  .product-row.drop-target { border-color: #2d6a4f; background: #e8f5e9; }
  .product-row.matched { background: #f0fdf4; border-color: #bbf7d0; }
  .product-row .thumb { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #f0f0f0; display: flex; align-items: center; justify-content: center; }
  .product-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .product-row .thumb .placeholder { font-size: 20px; color: #ccc; }
  .product-row .info { flex: 1; min-width: 0; }
  .product-row .info .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .product-row .info .meta { font-size: 12px; color: #888; margin-top: 2px; }
  .product-row .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 8px; white-space: nowrap; }
  .product-row .badge.matched { background: #dcfce7; color: #166534; }
  .product-row .badge.unmatched { background: #f1f5f9; color: #64748b; }
  .product-row .remove-match { background: none; border: 1px solid #fca5a5; color: #dc2626; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .product-row .remove-match:hover { background: #fef2f2; }

  .footer { background: #fff; border-top: 1px solid #e0e0e0; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  .footer .info { font-size: 13px; color: #666; }
  .footer button { padding: 10px 28px; background: #2d6a4f; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .footer button:disabled { background: #ccc; cursor: not-allowed; }
  .footer button:not(:disabled):hover { background: #1b4332; }

  .empty { text-align: center; padding: 48px 24px; color: #999; font-size: 14px; }
  .loading { text-align: center; padding: 48px; color: #888; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <h1>התחברות — QuickStock</h1>
  <div id="loginError" class="error" style="display:none"></div>
  <input id="loginEmail" type="email" placeholder="אימייל" autocomplete="email">
  <input id="loginPassword" type="password" placeholder="סיסמה" autocomplete="current-password">
  <button id="loginBtn" onclick="handleLogin()">התחבר</button>
</div>

<div id="app" class="app">
  <div class="header">
    <h1>התאמת תמונות למוצרים</h1>
    <div class="stats" id="stats"></div>
  </div>

  <div class="main">
    <div class="drop-zone-panel">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:32px">📁</div>
        <div>גררו תמונות לכאן<br>או לחצו לבחירה</div>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>
      <div style="font-size:12px;color:#888;text-align:center" id="imageCount"></div>
      <div class="image-strip" id="imageStrip"></div>
    </div>

    <div class="products-panel">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="חפש מוצר לפי שם, מק״ט או קטגוריה..." oninput="renderProducts()">
        <button class="clear" onclick="document.getElementById('searchInput').value='';renderProducts()">×</button>
      </div>
      <div class="product-list" id="productList"></div>
    </div>
  </div>

  <div class="footer">
    <div class="info" id="matchCount"></div>
    <button id="exportBtn" onclick="exportJSON()" disabled>ייצוא JSON</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nzmpxacaovhtmyvhtjtb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56bXB4YWNhb3ZodG15dmh0anRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjU3NDEsImV4cCI6MjA5NzkwMTc0MX0.SbOAlglW40MhKKRO_PvVLGOxHqwOY28EJFnycQetze4';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let products = [];
let images = []; // { id, name, base64 }
let matches = {}; // product_id -> { imageId, base64 }
let dragImageId = null;

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  if (!email || !password) { errEl.textContent = 'יש להזין אימייל וסיסמה'; errEl.style.display = 'block'; return; }

  document.getElementById('loginBtn').textContent = 'מתחבר...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = 'שגיאה: ' + error.message;
    errEl.style.display = 'block';
    document.getElementById('loginBtn').textContent = 'התחבר';
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadProducts();
}

// Auto-login if session exists
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await loadProducts();
  }
})();

async function loadProducts() {
  document.getElementById('productList').innerHTML = '<div class="loading">טוען מוצרים...</div>';
  const { data, error } = await sb.from('products').select('id, name, sku, category, supplier').or('image_url.is.null,image_url.eq.');
  if (error) {
    document.getElementById('productList').innerHTML = '<div class="empty">שגיאה בטעינה: ' + error.message + '</div>';
    return;
  }
  products = (data || []).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'he'));
  renderProducts();
}

function renderProducts() {
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  let filtered = products;
  if (q) {
    filtered = products.filter(p =>
      (p.name || '').toLowerCase().includes(q) ||
      (p.sku || '').toLowerCase().includes(q) ||
      (p.category || '').toLowerCase().includes(q)
    );
  }

  const unmatched = filtered.filter(p => !matches[p.id]);
  const matched = filtered.filter(p => !!matches[p.id]);
  const sorted = [...unmatched, ...matched];

  if (sorted.length === 0) {
    document.getElementById('productList').innerHTML = '<div class="empty">' + (products.length === 0 ? 'כל המוצרים כבר מותאמים לתמונות' : 'לא נמצאו מוצרים') + '</div>';
  } else {
    document.getElementById('productList').innerHTML = sorted.map(p => {
      const m = matches[p.id];
      const meta = [p.sku ? 'מק״ט: ' + p.sku : '', p.category || '', p.supplier || ''].filter(Boolean).join(' · ');
      return '<div class="product-row' + (m ? ' matched' : '') + '" data-id="' + p.id + '" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, \'' + p.id + '\')">' +
        '<div class="thumb">' + (m ? '<img src="' + m.base64 + '">' : '<div class="placeholder">🖼</div>') + '</div>' +
        '<div class="info"><div class="name">' + (p.name || 'ללא שם') + '</div>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>' +
        (m ? '<button class="remove-match" onclick="removeMatch(\'' + p.id + '\')">הסר</button>' : '') +
        '<span class="badge ' + (m ? 'matched' : 'unmatched') + '">' + (m ? '✓ מותאם' : 'ממתין') + '</span>' +
        '</div>';
    }).join('');
  }

  updateStats();
}

function updateStats() {
  const total = products.length;
  const matchedCount = Object.keys(matches).length;
  document.getElementById('stats').textContent = total + ' מוצרים ללא תמונה';
  document.getElementById('matchCount').textContent = matchedCount + ' מתוך ' + total + ' הותאמו';
  document.getElementById('exportBtn').disabled = matchedCount === 0;
}

// Drop zone
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });

function addFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const reader = new FileReader();
    const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    reader.onload = () => {
      images.push({ id, name: file.name, base64: reader.result });
      renderImageStrip();
    };
    reader.readAsDataURL(file);
  }
}

function renderImageStrip() {
  const usedIds = new Set(Object.values(matches).map(m => m.imageId));
  const available = images.filter(img => !usedIds.has(img.id));
  document.getElementById('imageCount').textContent = images.length + ' תמונות נטענו · ' + available.length + ' זמינות';
  document.getElementById('imageStrip').innerHTML = available.map(img =>
    '<div class="image-strip-item" draggable="true" data-img-id="' + img.id + '" ondragstart="onImgDragStart(event, \'' + img.id + '\')" ondragend="onImgDragEnd(event)" title="' + img.name + '">' +
    '<img src="' + img.base64 + '">' +
    '<button class="remove-img" onclick="removeImage(\'' + img.id + '\')" title="הסר תמונה">×</button>' +
    '</div>'
  ).join('');
}

function removeImage(imgId) {
  images = images.filter(i => i.id !== imgId);
  // Remove any match using this image
  for (const pid of Object.keys(matches)) {
    if (matches[pid].imageId === imgId) delete matches[pid];
  }
  renderImageStrip();
  renderProducts();
}

// Drag from strip
function onImgDragStart(e, imgId) {
  dragImageId = imgId;
  e.dataTransfer.effectAllowed = 'copy';
  e.target.closest('.image-strip-item').classList.add('dragging');
}
function onImgDragEnd(e) {
  dragImageId = null;
  document.querySelectorAll('.image-strip-item.dragging').forEach(el => el.classList.remove('dragging'));
}

// Drop onto product
function onDragOver(e) {
  if (!dragImageId) return;
  e.preventDefault();
  e.currentTarget.classList.add('drop-target');
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drop-target');
}
function onDrop(e, productId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drop-target');
  if (!dragImageId) return;
  const img = images.find(i => i.id === dragImageId);
  if (!img) return;
  // Remove this image from any previous match
  for (const pid of Object.keys(matches)) {
    if (matches[pid].imageId === dragImageId) delete matches[pid];
  }
  matches[productId] = { imageId: img.id, base64: img.base64 };
  dragImageId = null;
  renderImageStrip();
  renderProducts();
}

function removeMatch(productId) {
  delete matches[productId];
  renderImageStrip();
  renderProducts();
}

function exportJSON() {
  const entries = Object.entries(matches).map(([pid, m]) => {
    const p = products.find(x => x.id === pid);
    return {
      product_id: pid,
      product_name: p?.name || '',
      sku: p?.sku || '',
      image_base64: m.base64,
    };
  });
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'image-matches-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
