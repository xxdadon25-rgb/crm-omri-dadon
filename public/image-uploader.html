<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>העלאת תמונות למוצרים — QuickStock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f4f5f7; color: #1a1a1a; min-height: 100vh; }

  .login-screen { max-width: 380px; margin: 80px auto; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .login-screen h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  .login-screen input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 12px; font-size: 14px; direction: ltr; }
  .login-screen button { width: 100%; padding: 12px; background: #2d6a4f; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .login-screen button:hover { background: #1b4332; }
  .login-screen .error { color: #dc2626; font-size: 13px; margin-bottom: 10px; text-align: center; }

  .app { display: none; max-width: 720px; margin: 0 auto; padding: 24px; }
  .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); margin-bottom: 16px; }
  .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

  .upload-zone { border: 2px dashed #aaa; border-radius: 14px; padding: 32px; text-align: center; color: #888; font-size: 14px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  .upload-zone.dragover { border-color: #2d6a4f; background: #e8f5e9; color: #2d6a4f; }
  .upload-zone input { display: none; }

  .file-info { margin-top: 14px; padding: 12px 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; font-size: 13px; display: none; }
  .file-info .name { font-weight: 600; }

  .btn { padding: 12px 32px; background: #2d6a4f; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
  .btn:hover { background: #1b4332; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }

  .progress-section { display: none; }
  .progress-bar-track { width: 100%; height: 10px; background: #e5e7eb; border-radius: 10px; overflow: hidden; margin: 12px 0; }
  .progress-bar-fill { height: 100%; background: #2d6a4f; border-radius: 10px; transition: width 0.3s; width: 0%; }
  .progress-text { font-size: 13px; color: #666; text-align: center; margin-bottom: 8px; }
  .progress-current { font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 4px; }

  .results { display: none; }
  .summary { display: flex; gap: 12px; margin-bottom: 16px; }
  .summary-card { flex: 1; padding: 16px; border-radius: 12px; text-align: center; }
  .summary-card .num { font-size: 28px; font-weight: 800; }
  .summary-card .label { font-size: 12px; color: #666; margin-top: 4px; }
  .summary-card.success { background: #f0fdf4; color: #166534; }
  .summary-card.fail { background: #fef2f2; color: #991b1b; }
  .summary-card.total { background: #f1f5f9; color: #334155; }

  .log-list { max-height: 300px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 10px; }
  .log-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .log-item:last-child { border-bottom: none; }
  .log-item .icon { font-size: 16px; flex-shrink: 0; }
  .log-item .name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-item .detail { font-size: 12px; color: #999; flex-shrink: 0; }
  .log-item.fail .detail { color: #dc2626; }

  .btn-outline { padding: 10px 24px; background: #fff; color: #2d6a4f; border: 2px solid #2d6a4f; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .btn-outline:hover { background: #e8f5e9; }

  .back-link { display: inline-block; margin-bottom: 16px; font-size: 13px; color: #2d6a4f; text-decoration: none; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <h1>התחברות — QuickStock</h1>
  <div id="loginError" class="error" style="display:none"></div>
  <input id="loginEmail" type="email" placeholder="אימייל" autocomplete="email">
  <input id="loginPassword" type="password" placeholder="סיסמה" autocomplete="current-password">
  <button id="loginBtn" onclick="handleLogin()">התחבר</button>
</div>

<div id="app" class="app">
  <a href="/image-matcher.html" class="back-link">← חזרה לכלי ההתאמה</a>

  <!-- Step 1: Upload JSON -->
  <div id="step1" class="card">
    <h2>העלאת קובץ JSON</h2>
    <p style="font-size:13px;color:#888;margin-bottom:14px">העלו את קובץ ה-JSON שיוצא מכלי ההתאמה (image-matches-*.json)</p>
    <div class="upload-zone" id="jsonDropZone" onclick="document.getElementById('jsonInput').click()">
      <div style="font-size:32px;margin-bottom:8px">📄</div>
      <div>גררו קובץ JSON לכאן או לחצו לבחירה</div>
      <input type="file" id="jsonInput" accept=".json,application/json">
    </div>
    <div class="file-info" id="fileInfo">
      <span class="name" id="fileName"></span> — <span id="fileCount"></span> מוצרים
    </div>
    <button class="btn" id="startBtn" onclick="startUpload()" disabled>התחל העלאה</button>
  </div>

  <!-- Step 2: Progress -->
  <div id="step2" class="card progress-section">
    <h2>מעלה תמונות...</h2>
    <div class="progress-current" id="progressCurrent"></div>
    <div class="progress-text" id="progressText"></div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <!-- Step 3: Results -->
  <div id="step3" class="card results">
    <h2>סיכום</h2>
    <div class="summary">
      <div class="summary-card total"><div class="num" id="totalNum">0</div><div class="label">סה״כ</div></div>
      <div class="summary-card success"><div class="num" id="successNum">0</div><div class="label">הצליחו</div></div>
      <div class="summary-card fail"><div class="num" id="failNum">0</div><div class="label">נכשלו</div></div>
    </div>
    <div class="log-list" id="logList"></div>
    <button class="btn-outline" id="downloadFailBtn" onclick="downloadFailures()" style="display:none">הורד רשימת כשלונות (JSON)</button>
    <button class="btn" onclick="location.reload()" style="margin-top:12px">התחל מחדש</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nzmpxacaovhtmyvhtjtb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56bXB4YWNhb3ZodG15dmh0anRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjU3NDEsImV4cCI6MjA5NzkwMTc0MX0.SbOAlglW40MhKKRO_PvVLGOxHqwOY28EJFnycQetze4';
const BUCKET = 'product-images';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let entries = [];
let logItems = [];

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'יש להזין אימייל וסיסמה'; errEl.style.display = 'block'; return; }
  document.getElementById('loginBtn').textContent = 'מתחבר...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = 'שגיאה: ' + error.message;
    errEl.style.display = 'block';
    document.getElementById('loginBtn').textContent = 'התחבר';
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
})();

// JSON file handling
const jsonDropZone = document.getElementById('jsonDropZone');
const jsonInput = document.getElementById('jsonInput');

jsonDropZone.addEventListener('dragover', (e) => { e.preventDefault(); jsonDropZone.classList.add('dragover'); });
jsonDropZone.addEventListener('dragleave', () => jsonDropZone.classList.remove('dragover'));
jsonDropZone.addEventListener('drop', (e) => { e.preventDefault(); jsonDropZone.classList.remove('dragover'); handleJSONFile(e.dataTransfer.files[0]); });
jsonInput.addEventListener('change', (e) => { handleJSONFile(e.target.files[0]); e.target.value = ''; });

function handleJSONFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed) || parsed.length === 0) {
        alert('הקובץ ריק או בפורמט לא תקין');
        return;
      }
      if (!parsed[0].product_id || !parsed[0].image_base64) {
        alert('הקובץ חסר שדות נדרשים (product_id, image_base64)');
        return;
      }
      entries = parsed;
      document.getElementById('fileInfo').style.display = 'block';
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileCount').textContent = entries.length;
      document.getElementById('startBtn').disabled = false;
    } catch {
      alert('שגיאה בקריאת הקובץ — ודאו שזהו JSON תקין');
    }
  };
  reader.readAsText(file);
}

function base64ToBlob(base64) {
  const parts = base64.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/png';
  const raw = atob(parts[1]);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return { blob: new Blob([arr], { type: mime }), mime };
}

function extFromMime(mime) {
  if (mime.includes('png')) return '.png';
  if (mime.includes('webp')) return '.webp';
  if (mime.includes('gif')) return '.gif';
  return '.jpg';
}

async function startUpload() {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';

  let succeeded = 0;
  let failed = 0;
  logItems = [];

  for (let i = 0; i < entries.length; i++) {
    const entry = entries[i];
    const label = entry.product_name || entry.sku || entry.product_id;

    document.getElementById('progressCurrent').textContent = label;
    document.getElementById('progressText').textContent = (i + 1) + ' מתוך ' + entries.length;
    document.getElementById('progressBar').style.width = ((i + 1) / entries.length * 100) + '%';

    try {
      const { blob, mime } = base64ToBlob(entry.image_base64);
      const ext = extFromMime(mime);
      const filename = 'products/' + entry.product_id + ext;

      const { error: uploadErr } = await sb.storage.from(BUCKET).upload(filename, blob, {
        contentType: mime,
        upsert: true,
      });
      if (uploadErr) throw new Error('העלאה: ' + uploadErr.message);

      const { data: { publicUrl } } = sb.storage.from(BUCKET).getPublicUrl(filename);

      const { error: updateErr } = await sb.from('products').update({ image_url: publicUrl }).eq('id', entry.product_id);
      if (updateErr) throw new Error('עדכון DB: ' + updateErr.message);

      succeeded++;
      logItems.push({ name: label, status: 'success', detail: 'הועלה בהצלחה' });
    } catch (err) {
      failed++;
      logItems.push({ name: label, status: 'fail', detail: err.message, entry });
    }
  }

  // Show results
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'block';
  document.getElementById('totalNum').textContent = entries.length;
  document.getElementById('successNum').textContent = succeeded;
  document.getElementById('failNum').textContent = failed;

  document.getElementById('logList').innerHTML = logItems.map(item =>
    '<div class="log-item ' + item.status + '">' +
    '<span class="icon">' + (item.status === 'success' ? '✅' : '❌') + '</span>' +
    '<span class="name">' + item.name + '</span>' +
    '<span class="detail">' + item.detail + '</span>' +
    '</div>'
  ).join('');

  if (failed > 0) {
    document.getElementById('downloadFailBtn').style.display = 'block';
  }
}

function downloadFailures() {
  const failures = logItems.filter(i => i.status === 'fail').map(i => ({
    product_id: i.entry.product_id,
    product_name: i.entry.product_name,
    sku: i.entry.sku,
    error: i.detail,
  }));
  const blob = new Blob([JSON.stringify(failures, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'upload-failures-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
